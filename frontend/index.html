<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkoWizard — Analytical Workstation</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <meta name="theme-color" content="#f9f9f7" />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
</head>

<body>
    <header class="mw-header">

        </a>
        <span class="tag tag-neutral" id="mw-header-universe">AAPL · MSFT · SPY · BND · GLD</span>
        <span class="tag tag-outline" id="mw-header-period">5Y monthly</span>
        <span class="text-muted" style="font-size: 12px" id="mw-header-status">Not run yet</span>
        <button type="button" class="btn btn-secondary" id="mw-units-btn">Monthly</button>
        <button type="button" class="btn btn-secondary mw-theme-btn" id="mw-theme-btn" title="Theme" aria-label="Theme" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.2"/><circle cx="17.5" cy="10.5" r="1.2"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="6.5" cy="12.5" r="1.2"/><path d="M12 2a10 10 0 0 0 0 20 1.7 1.7 0 0 0 1.7-1.7c0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1a1.7 1.7 0 0 1 1.7-1.7h2A5.6 5.6 0 0 0 22 10.8C22 5.9 17.5 2 12 2z"/></svg></button>
    </header>

    <div class="mw-shell">
        <aside class="mw-rail" aria-label="Portfolio controls">

            <div class="card elev-sm">
                <h6 style="margin: 0; color: var(--color-accent-300)">Universe</h6>
                <div class="mw-chip-row" id="mw-chips"></div>
                <form id="mw-add-ticker-form" class="mw-add-ticker">
                    <input type="text" id="mw-add-ticker-input" placeholder="Add a ticker (e.g. SPY)" maxlength="10"
                        autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Add a ticker" />
                    <button type="submit" class="btn btn-secondary">Add</button>
                </form>
                <div class="mw-add-ticker__error" id="mw-add-ticker-error" hidden></div>
                <div class="text-muted" style="font-size: 11px" id="mw-chip-count"></div>
            </div>

            <div class="card elev-sm">
                <h6 style="margin: 0; color: var(--color-accent-300)">History window</h6>
                <div class="seg" style="width: 100%" id="mw-period">
                    <label class="seg-opt" style="flex: 1"><input type="radio" name="mwperiod" value="1y">1Y</label>
                    <label class="seg-opt" style="flex: 1"><input type="radio" name="mwperiod" value="2y">2Y</label>
                    <label class="seg-opt" style="flex: 1"><input type="radio" name="mwperiod" value="5y" checked>5Y</label>
                    <label class="seg-opt" style="flex: 1"><input type="radio" name="mwperiod" value="10y">10Y</label>
                    <label class="seg-opt" style="flex: 1"><input type="radio" name="mwperiod" value="max">Max</label>
                </div>
                <div class="field" style="margin-top: var(--space-3)">
                    <label for="mwrf" id="mwrf-label">Risk-free rate · monthly</label>
                    <div style="display: flex; gap: var(--space-2); align-items: center">
                        <input id="mwrf" type="range" min="0" max="80" step="1" value="8"
                            style="flex: 1; min-width: 0; accent-color: var(--color-accent); height: 20px" />
                        <input id="mwrf-display" class="mw-rf-value" type="text" inputmode="decimal"
                            autocomplete="off" aria-label="Risk-free rate, percent" value="0.20" />
                        <span class="text-muted" style="font-size: 14px">%</span>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-primary btn-block" id="mw-run-btn" data-action="run" style="height: 38px">Run analysis</button>

        </aside>

        <main id="top" class="mw-report">
            <div id="mw-kpi-slot"></div>
            <div id="mw-frontier-slot"></div>
            <div id="mw-allocation-slot"></div>
            <div id="mw-correlation-slot"></div>
            <div id="mw-assets-slot"></div>
            <div id="mw-saved-slot"></div>
            <p class="text-muted mw-disclaimer">Expected returns and covariances are estimated from historical
                monthly closes and are not forecasts. Long-only, fully invested, no transaction costs or taxes.</p>
        </main>
    </div>

    <div id="mw-overlay" class="mw-overlay" hidden>
        <div class="card elev-lg mw-overlay__card">
            <div class="mw-spinner"></div>
            <div class="mw-overlay__title">Solving 60 quadratic programs</div>
            <div class="text-muted mw-overlay__note" id="mw-overlay-note"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
